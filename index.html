<template id="t-about">
  <h2>About me</h2>
  <p class="big" style="font-size:clamp(28px,4vw,50px);max-width:20ch">Hi, I&rsquo;m Isla, an interaction design student based in Malm&ouml;.</p>
  <p>I come from Scotland and Cyprus, and I love bringing those two different worlds into my designs.</p>
  <p style="margin-top:14px">I&rsquo;m passionate about beautiful sites and creating whole experiences, both on and off the screen. Accessibility is a focus too: making beautiful work for everyone.</p>
</template>

<template id="t-work">
  <h2>Work</h2>
  <div class="cards">
    <article class="wc"><details>
      <summary><span class="k">Access / Group project, Dec 2025</span><h3>Doro</h3><p>Accessible guidance system</p><b>+</b></summary>
      <div class="case-body">
        <div><h4>Overview</h4><p>A group project of five for the Graphical User Interfaces course, designed for Doro phones and older users. We made an on-screen owl guide that talks people through everyday tasks such as making a video call, downloading an app or blocking a number, so they can use their phone independently.</p></div>
        <div><h4>The idea</h4><p>The owl was chosen to suggest knowledge and guidance. One short instruction appears at a time in a speech bubble, while the relevant apps and buttons are highlighted and everything else is dimmed. The owl can be moved, and tapping it opens or closes the guide.</p></div>
        <div><h4>My contribution</h4><p>My sketch proposed a &ldquo;guide me&rdquo; function available from the home page and throughout the phone. It opens with a polite, plain question and lists options by how often they are used. It also adds a confirmation step before a call starts, to avoid accidental taps.</p></div>
        <div><h4>Process</h4>
          <div class="steps">
            <div class="step"><b>Sketching</b><p>Everyone sketched ideas, from app groups to side bars and search helpers. We combined them into one guided shortcut system.</p></div>
            <div class="step"><b>Wireframes</b><p>Contrast and shadows made actions easy to spot and cut distractions. A limited round of user testing supported the owl idea.</p></div>
            <div class="step"><b>Final style</b><p>We dropped outlines and the bubble arrow, raised contrast and shortened the text. Buttons light up when pressed to confirm each action.</p></div>
          </div>
        </div>
        <div><h4>Final screens</h4><div class="shots"><figure><img src="images/01-doro-prototype-screen-start-the-guide-as.jpg" alt="Doro prototype screen: Start: the guide asks what you need help with" loading="lazy"><figcaption>Start: the guide asks what you need help with</figcaption></figure><figure><img src="images/02-doro-prototype-screen-one-clear-step-at-.jpg" alt="Doro prototype screen: One clear step at a time, with next and back" loading="lazy"><figcaption>One clear step at a time, with next and back</figcaption></figure><figure><img src="images/03-doro-prototype-screen-relevant-options-s.jpg" alt="Doro prototype screen: Relevant options stay bright while the rest fades" loading="lazy"><figcaption>Relevant options stay bright while the rest fades</figcaption></figure><figure><img src="images/04-doro-prototype-screen-guiding-through-th.jpg" alt="Doro prototype screen: Guiding through the phone settings" loading="lazy"><figcaption>Guiding through the phone settings</figcaption></figure><figure><img src="images/05-doro-prototype-screen-a-clear-confirmati.jpg" alt="Doro prototype screen: A clear confirmation to end the guide" loading="lazy"><figcaption>A clear confirmation to end the guide</figcaption></figure></div></div>
        <div><h4>Palette</h4><div class="chips"><i style="background:#06651c" title="#06651C"></i><i style="background:#660c00" title="#660C00"></i><i style="background:#fce6c5" title="#FCE6C5"></i><i style="background:#202020" title="#202020"></i><i style="background:#647785" title="#647785"></i></div></div>
      </div>
    </details></article>
    <article class="wc"><details>
      <summary><span class="k">Inclusive play / Bachelor Year I</span><h3>Soundscape Builder</h3><p>Building imaginative worlds with sound</p><b>+</b></summary>
      <div class="case-body">
        <figure class="pic"><img src="images/06-wooden-grid-board-with-cylindrical-sound.jpg" alt="Wooden grid board with cylindrical sound blocks" loading="lazy"><figcaption>The physical prototype: a grid board with colour-coded blocks</figcaption></figure>
        <div><h4>Overview</h4><p>A tangible audio kit that helps blind and visually impaired (BVI) children start and lead pretend play with sighted peers. A Studio I project with fieldwork, a physical prototype, a browser soundboard and an exhibition poster.</p></div>
        <div><h4>What I learned</h4><p>Fieldwork with two special education professionals, one BVI and one sighted, showed that BVI children are usually not the ones who start the game. Play built around visual cues leaves them passive. Audio is a strength, not a workaround, and true inclusion means one shared entry point, not parallel versions.</p></div>
        <div><h4>The concept</h4><p>Shake a block to hear a snippet of its sound, then slot it into the grid to add it to the shared world. When the soundscape is ready the volume swells, signalling every child to enter the pretend play together.</p></div>
        <div><h4>Design qualities</h4><div class="tags"><span>Shareable</span><span>Child-led</span><span>Buildable</span><span>Exploratory</span><span>Tangible</span><span>Intuitive</span></div></div>
        <figure class="pic"><img src="images/07-hand-drawn-storyboard-of-children-playin.jpg" alt="Hand-drawn storyboard of children playing with the sound blocks" loading="lazy"><figcaption>Storyboard: from choosing a sound to the whole group joining in</figcaption></figure>
        <div><h4>Next step</h4><p>A finished version would have a built-in speaker for autonomy and portability, and different textures on the blocks for ambience, foreground and voice.</p></div>
      </div>
    </details></article>

    <article class="wc"><details>
      <summary><span class="k">Experiments in progress</span><h3>Playground</h3><p>UI + identity studies</p><b>+</b></summary>
      <div class="case-body">
        <div><h4>Heirlooms by Deldesigned</h4><p>A web concept for a family furniture and print business that hand paints floral designs onto chairs and tables. The aim was to let the painted pieces lead and keep the site warm, personal and simple to browse. This is an early idea for exploring layout and mood, not a finished design.</p></div>
        <figure class="pic"><img src="images/08-heirlooms-by-deldesigned-header-with-box.jpg" alt="Heirlooms by Deldesigned header with boxed typewriter logo beside a floral print" loading="lazy"><figcaption>Rough identity idea: a boxed typewriter-style logo beside the floral print</figcaption></figure>
        <div><h4>Rough wireframe, not a finished design</h4>

<script>
(function(){
  var dlg=document.getElementById('dlg'),body=document.getElementById('body'),sheet=document.getElementById('sheet'),
      g=document.getElementById('glow'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-open');
      body.innerHTML=document.getElementById('t-'+k).innerHTML;
      sheet.setAttribute('data-tone',k);sheet.scrollTop=0;dlg.showModal();
    });
  });
  function shut(){
    if(reduce){dlg.close();return}
    dlg.classList.add('out');
    setTimeout(function(){dlg.classList.remove('out');dlg.close()},350);
  }
  document.getElementById('x').addEventListener('click',shut);
  dlg.addEventListener('click',function(e){if(e.target===dlg)shut()});
  dlg.addEventListener('cancel',function(e){e.preventDefault();shut()});
  if(!reduce)document.addEventListener('pointermove',function(e){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
})();
</script>
